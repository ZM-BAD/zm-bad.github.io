name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# pages/id-token 只给 deploy job：build 要 npm install 全部依赖，
# 给它 OIDC 签发权，一个被投毒的传递依赖就能往 Pages 部署任意内容。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 官方 Action：安装依赖 + 构建 + 上传产物，一步到位
      # 注意：它会扫描 lockfile 判断包管理器，所以 package-lock.json 必须提交
      - uses: withastro/action@v6
        with:
          # 与 .nvmrc / package.json engines 保持一致（24 = 当前 Active LTS）
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 只有这一步需要：pages: write 调部署 API，id-token: write 走 OIDC 认证
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
